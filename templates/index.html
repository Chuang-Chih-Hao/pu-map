<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>靜宜新生防迷路地圖 ＆ 揪團大廳</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        :root { --primary-blue: #1a73e8; --accent-red: #d93025; --bg-gray: #f0f2f5; }
        body { font-family: sans-serif; text-align: center; background-color: var(--bg-gray); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .search-box { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { padding: 14px; width: 60%; border: 2px solid #eee; border-radius: 12px; font-size: 16px; outline: none; }
        .btn-primary { padding: 14px 28px; background: var(--primary-blue); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; }
        .main-layout { display: flex; gap: 20px; text-align: left; }
        #map { height: 500px; flex: 2; border-radius: 15px; border: 1px solid #eee; }
        .sidebar-panel { flex: 1; background: #fafafa; border-radius: 15px; padding: 15px; height: 500px; display: flex; flex-direction: column; }
        .group-list { max-height: 380px; overflow-y: auto; flex-grow: 0; margin-bottom: 10px; }
        .group-card { background: white; padding: 12px; border-radius: 10px; margin-bottom: 10px; border-left: 5px solid var(--accent-red); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .chat-view { display: none; flex-direction: column; height: 100%; background: white; border-radius: 12px; }
        .campus-img { margin-top: 30px; text-align: center; }
        .campus-img img { width: 100%; max-width: 700px; border-radius: 15px; }
        .custom-map-control { background: #fff; border-radius: 50%; box-shadow: 0 1px 4px rgba(0,0,0,0.3); cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; margin: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>靜宜新生防迷路地圖 ＆ 揪團大廳</h1>
        <div class="search-box">
            <input type="text" id="roomInput" list="searchSuggestions" placeholder="搜尋地點、科系或找餐廳/宿舍..." onkeypress="if(event.key === 'Enter') searchRoom()">
            <datalist id="searchSuggestions"></datalist>
            <button class="btn-primary" onclick="searchRoom()">帶我去</button>
        </div>

        <div class="main-layout">
            <div id="map"></div>
            <div class="sidebar-panel">
                <div id="groupView">
                    <h3>🔥 限時揪團</h3>
                    <div class="group-list" id="groupList"></div>
                    <input type="text" id="groupTitle" placeholder="標題..." style="width:100%; padding:8px; margin-bottom:5px;">
                    <select id="groupLocation" style="width:100%; padding:8px; margin-bottom:5px;"></select>
                    <button style="width:100%; padding:10px; background:#34a853; color:white; border:none; border-radius:8px;" onclick="createNewGroup()">📢 發起揪團</button>
                </div>
                <div id="chatView" class="chat-view">
                    <div style="background:var(--accent-red); color:white; padding:10px; border-radius:8px 8px 0 0; display:flex; justify-content:space-between;">
                        <span id="chatTitle">聊天室</span><button onclick="leaveChat()" style="background:none; border:none; color:white; cursor:pointer;">❌</button>
                    </div>
                    <div id="chatMessages" style="flex-grow:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:5px;"></div>
                    <div style="display:flex; padding:10px; border-top:1px solid #eee;">
                        <input type="text" id="chatInputMsg" style="flex:1; padding:8px; border-radius:20px; border:1px solid #ddd;" onkeypress="if(event.key === 'Enter') sendMessage()">
                    </div>
                </div>
            </div>
        </div>

        <div class="campus-img">
            <h3>📍 靜宜大學校園平面圖</h3>
            <img src="{{ url_for('static', filename='map_in_PU.jpg') }}" alt="校園圖">
        </div>
    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key={{ api_key }}&callback=initMap" async defer></script>
    <script>
        let map, directionsRenderer, directionsService, infoWindow, userMarker;
        let currentMarkers = []; // 改為陣列以存儲多個標記
        const campusData = {{ locations | tojson | safe }};
        const socket = io();
        let myUsername = "新生_" + Math.floor(Math.random() * 1000);
        let currentGroupId = null;

        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), { zoom: 16, center: { lat: 24.2272, lng: 120.5810 }, mapTypeControl: false });
            infoWindow = new google.maps.InfoWindow();
            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({ map: map });
            trackUserLocation();
            initSearchSuggestions();
            initLocationSelect();
            fetchGroups();
        }

        function trackUserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(pos => {
                    const p = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    if (!userMarker) {
                        userMarker = new google.maps.Marker({ position: p, map: map, icon: { path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: "#4285F4", fillOpacity: 1, strokeColor: "white", strokeWeight: 2 } });
                    } else userMarker.setPosition(p);
                }, null, { enableHighAccuracy: true });
            }
        }

        // --- 核心修改：顯示多個結果 ---
        async function searchRoom() {
            const input = document.getElementById('roomInput').value.trim().toLowerCase();
            if (!input) return;

            // 清除之前的標記
            currentMarkers.forEach(m => m.setMap(null));
            currentMarkers = [];

            let results = [];
            
            // 找出所有符合條件的地點
            for (let name in campusData) {
                const loc = campusData[name];
                const depts = (loc.depts || "").toLowerCase();
                if (name.toLowerCase().includes(input) || depts.includes(input)) {
                    results.push({ name, ...loc });
                }
            }

            if (results.length > 0) {
                const bounds = new google.maps.LatLngBounds();
                
                results.forEach(loc => {
                    const pos = { lat: loc.lat, lng: loc.lng };
                    const marker = new google.maps.Marker({ position: pos, map: map, animation: google.maps.Animation.DROP, title: loc.name });
                    
                    marker.addListener('click', () => {
                        infoWindow.setContent(`<div style="padding:10px; color:black;"><h3>${loc.name}</h3><p>${loc.desc || ''}</p><button onclick="nav(${loc.lat},${loc.lng})" style="background:#1a73e8; color:white; border:none; padding:8px; border-radius:4px; cursor:pointer; width:100%;">🚶 規劃路線</button></div>`);
                        infoWindow.open(map, marker);
                    });
                    
                    currentMarkers.push(marker);
                    bounds.extend(pos);
                });

                // 如果結果大於一個，自動縮放地圖包圍所有點
                if (results.length > 1) {
                    map.fitBounds(bounds);
                } else {
                    map.panTo(results[0]);
                    map.setZoom(18);
                }
            } else {
                alert("找不到相關地點！");
            }
        }

        function nav(lat, lng) {
            navigator.geolocation.getCurrentPosition(pos => {
                directionsRenderer.setDirections({routes: []});
                directionsService.route({
                    origin: { lat: pos.coords.latitude, lng: pos.coords.longitude },
                    destination: { lat: lat, lng: lng },
                    travelMode: 'WALKING'
                }, (res, status) => { if (status === 'OK') directionsRenderer.setDirections(res); });
            });
        }

        function initSearchSuggestions() {
            const dl = document.getElementById('searchSuggestions');
            let s = new Set(["餐廳", "宿舍", "子母車", "運動", "游泳池", "溜冰場"]);
            for (let n in campusData) s.add(n);
            s.forEach(t => dl.appendChild(new Option(t, t)));
        }

        function initLocationSelect() {
            const s = document.getElementById('groupLocation');
            for (let n in campusData) s.appendChild(new Option(n, n));
        }

        async function fetchGroups() {
            const res = await fetch('/api/groups');
            const data = await res.json();
            const list = document.getElementById('groupList');
            list.innerHTML = data.length ? '' : '<p style="color:#999;text-align:center;">暫無揪團</p>';
            data.forEach(g => {
                const card = document.createElement('div');
                card.className = 'group-card';
                card.innerHTML = `<strong>${g.title}</strong><br><small>📍 ${g.location}</small><div style="margin-top:5px;"><button onclick="nav(${campusData[g.location].lat},${campusData[g.location].lng})" style="padding:5px; background:#e8f0fe; border:none; border-radius:5px; cursor:pointer;">🚶 導航</button> <button onclick="openChat('${g.id}','${g.title}')" style="padding:5px; background:#fff3cd; border:none; border-radius:5px; cursor:pointer;">💬 聊天</button></div>`;
                list.appendChild(card);
            });
        }

        async function createNewGroup() {
            const t = document.getElementById('groupTitle').value;
            const l = document.getElementById('groupLocation').value;
            if (!t || !l) return;
            await fetch('/api/groups', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ title: t, location: l }) });
            document.getElementById('groupTitle').value = ''; fetchGroups();
        }

        function openChat(id, title) {
            currentGroupId = id;
            document.getElementById('groupView').style.display = 'none';
            document.getElementById('chatView').style.display = 'flex';
            document.getElementById('chatTitle').innerText = title;
            socket.emit('join_chat', { group_id: id });
        }

        function leaveChat() { currentGroupId = null; document.getElementById('chatView').style.display = 'none'; document.getElementById('groupView').style.display = 'flex'; }

        function sendMessage() {
            const i = document.getElementById('chatInputMsg');
            if (i.value && currentGroupId) {
                socket.emit('send_message', { group_id: currentGroupId, username: myUsername, msg: i.value });
                i.value = '';
            }
        }

        socket.on('receive_message', d => {
            const box = document.getElementById('chatMessages');
            const div = document.createElement('div');
            const isMe = d.user === myUsername;
            div.style.alignSelf = isMe ? 'flex-end' : 'flex-start';
            div.style.background = isMe ? '#1a73e8' : '#eee';
            div.style.color = isMe ? 'white' : 'black';
            div.style.padding = '8px'; div.style.borderRadius = '10px'; div.style.maxWidth = '80%';
            div.innerHTML = `<small style="font-size:10px; display:block;">${d.user}</small>${d.msg}`;
            box.appendChild(div); box.scrollTop = box.scrollHeight;
        });
        
        setInterval(fetchGroups, 15000);
    </script>
</body>
</html>
